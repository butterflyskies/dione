[package]
name = "dione-rendering"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "LaTeX rendering and retained PNG files for Dione"
repository = "https://github.com/butterflyskies/dione"
readme = "README.md"
keywords = ["latex", "typst", "png"]
categories = ["multimedia::images"]

[dependencies]
mitex.workspace = true
png.workspace = true
tempfile.workspace = true
thiserror.workspace = true
typst.workspace = true
typst-as-lib.workspace = true
typst-assets.workspace = true
typst-render.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
