[package]
name = "dione-pluralkit-resolver"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Bounded PluralKit provider facts, response binding and cache"
repository = "https://github.com/butterflyskies/dione"
readme = "README.md"
keywords = ["discord", "pluralkit", "identity"]
categories = ["network-programming"]

[dependencies]
# Match the existing workspace standalone native-TLS build closure.
native-tls.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serenity.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
