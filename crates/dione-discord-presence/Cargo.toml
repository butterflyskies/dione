[package]
name = "dione-discord-presence"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Shared Discord presence requests, queue acknowledgements and reconnect replay"
repository = "https://github.com/butterflyskies/dione"
readme = "README.md"
keywords = ["discord", "presence", "async"]
