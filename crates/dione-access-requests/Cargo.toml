[package]
name = "dione-access-requests"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Pending access-request storage and notification bookkeeping for Dione"
repository = "https://github.com/butterflyskies/dione"
readme = "README.md"
keywords = ["access", "queue", "persistence"]
