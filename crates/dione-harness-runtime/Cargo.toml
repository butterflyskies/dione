[package]
name = "dione-harness-runtime"
version = "0.1.15"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Concrete provider session lifecycle and resource-free selection"
repository = "https://github.com/butterflyskies/dione"
readme = "README.md"
keywords = ["mcp", "session", "lifecycle"]
categories = ["asynchronous"]

[dependencies]
dione-harness.workspace = true
dione-config.workspace = true
dione-attention.workspace = true
dione-codex.workspace = true
dione-omp.workspace = true
dione-claude.workspace = true
camino.workspace = true
clap.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
dione-coordination.workspace = true
tracing.workspace = true
dione-bell-rings.workspace = true
dione-discord-events.workspace = true
dione-contracts.workspace = true
dione-messages.workspace = true
dione-provider-delivery.workspace = true
dione-durable.workspace = true
serde_json.workspace = true
tempfile.workspace = true
chrono-tz.workspace = true
serenity.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
tokio = { workspace = true, features = ["test-util"] }
