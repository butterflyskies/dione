[package]
name = "dione-delivery-scheduler"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Scoped FIFO delivery scheduling with bounded immediate bursts"
repository = "https://github.com/butterflyskies/dione"
readme = "README.md"
keywords = ["scheduling", "fifo", "delivery"]
categories = ["asynchronous", "data-structures"]

[dependencies]
dione-contracts.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
