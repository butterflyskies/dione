[package]
name = "dione-omp"
version = "0.2.4"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Durable OMP session actor and protocol adapter"
repository = "https://github.com/butterflyskies/dione"
readme = "README.md"
keywords = ["mcp", "session", "durable"]
categories = ["asynchronous"]

[dependencies]
dione-durable.workspace = true
dione-harness.workspace = true
dione-messages.workspace = true
dione-provider-delivery.workspace = true
dione-teams-identities.workspace = true
dione-contracts.workspace = true
dione-presentation.workspace = true
camino.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
futures-util.workspace = true

[dev-dependencies]
dione-durable = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
trybuild.workspace = true
tokio = { workspace = true, features = ["test-util"] }
