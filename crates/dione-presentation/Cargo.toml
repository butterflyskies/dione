[package]
name = "dione-presentation"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Retained delivery projection and compact message presentation"
repository = "https://github.com/butterflyskies/dione"
readme = "README.md"
keywords = ["messages", "presentation", "formatting"]
