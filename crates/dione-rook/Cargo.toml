[package]
name = "dione-rook"
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Durable recipient handling, context reads, and publication receipts for Dione"
repository = "https://github.com/butterflyskies/dione"
readme = "README.md"
keywords = ["recipient", "durable", "publication"]
categories = ["data-structures"]

[features]
test-support = []

[dependencies]
chrono.workspace = true
dione-contracts.workspace = true
dione-durable.workspace = true
fs2.workspace = true
futures-util.workspace = true
libc.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
