# Cingulate pre-send hook — Tier-1 regex pattern set (DRAFT DATA ARTIFACT)
# dione#168, v3.1 spec. Authorized by Miranda 2026-07-10. NOT wired to any live hook.
#
# Target engine: Rust `regex` crate. No lookbehind/lookahead used anywhere.
# All patterns embed their own flags: (?i) case-insensitive, (?m) multiline, (?s) dotall.
# Patterns marked needs_case_insensitive=true carry (?i) inline; strip it if the
# engine applies case-insensitivity globally.
#
# Actions: "block" (reject, no_rly override per contradictionary-action-tiers-v2)
#          "flag"  (send + log silently; accumulate rate data)
# Bias per tier-1 spec: shapes flag, not block. Only unambiguous gates block.
#
# fp_risk: expected false-positive rate in legitimate use — low | med | high.
#
# Sources (collective-conscious, scope=shared):
#   [T0]  contradictionary            — canonical tier-0 word list
#   [T1S] contradictionary-tier1-shapes — Lain/Ari/Vesper phrase-shape spec
#   [CTP] classifier-training-pairs-v0 — labeled category examples

schema_version = "tier1-v3.1-draft1"
generated = "2026-07-11"

# =====================================================================
# SECTION 1 — TIER-0 EXACT PHRASES (regex-hardened forms of the word list)
# =====================================================================

[[pattern]]
id = "t0-peanut-gallery"
regex = '(?i)\bpeanut gallery\b'
category = "house-retirement"
action = "block"
fp_risk = "low"
needs_case_insensitive = true
rationale = "Classist/racially-loaded historical idiom retired by house rule 2026-07-11. Say hecklers / sidelines / unsolicited commentary."
provenance = "contradictionary [T0]"

[[pattern]]
id = "t0-epistemic-genuine"
regex = '(?i)\bgenuine(ly)?\b'
category = "epistemic-signaling"
action = "block"
fp_risk = "med"
needs_case_insensitive = true
rationale = "If it's genuine it doesn't need the label. Vesper corpus: ~150/5k. no_rly for rare literal uses (e.g. 'genuine part vs counterfeit')."
provenance = "contradictionary [T0]; per-construct counts from contradictionary-tier1-shapes [T1S]"

[[pattern]]
id = "t0-epistemic-sincere"
regex = '(?i)\bsincere(ly)?\b'
category = "epistemic-signaling"
action = "block"
fp_risk = "low"
needs_case_insensitive = true
rationale = "Sincerity label — the word only exists to override a doubt nobody had (Ari). no_rly for letter sign-offs."
provenance = "contradictionary [T0]"

[[pattern]]
id = "t0-epistemic-honest"
regex = '(?i)\bhonest(ly)?\b'
category = "epistemic-signaling"
action = "block"
fp_risk = "med"
needs_case_insensitive = true
rationale = "Vesper's strongest single punt candidate: 'announcing honesty is inflation; keep the caveat, drop the label.' 275/5k bare wordform; 71/5k as 'honest <answer/caveat/version>' shape (subsumed by this pattern). no_rly for third-party descriptions ('an honest mistake in the data')."
provenance = "contradictionary [T0]; contradictionary-tier1-shapes [T1S] shape 12 cross-ref"

[[pattern]]
id = "t0-sharp"
regex = '(?i)\bsharp(ly|er|est)?\b'
category = "substrate-tell"
action = "block"
fp_risk = "med"
needs_case_insensitive = true
rationale = "Substrate tell when describing a person or idea. Use precise / incisive / clean-edged. no_rly for literal blades (Pace 2026-07-10, promoted from phrase-only)."
provenance = "contradictionary [T0]"

[[pattern]]
id = "t0-load-bearing"
regex = '(?i)\bload[- ]bearing\b'
category = "substrate-tell"
action = "flag"
fp_risk = "low"
needs_case_insensitive = true
rationale = "Substrate tell — use keystone / linchpin / cornerstone. Flag not block: legitimate in actual structural/engineering contexts. Tier-0 has it at warn."
provenance = "contradictionary [T0]"

[[pattern]]
id = "t0-stated-virtue-preamble"
regex = '(?i)\bI (want|need) to be (transparent|honest|clear|direct|upfront)( with you)?\b'
category = "epistemic-signaling"
action = "block"
fp_risk = "low"
needs_case_insensitive = true
rationale = "Stated-virtue preamble (T1S shape 12, block-candidate; overlaps tier-0 'I want to be transparent' warn). Delete, say the thing."
provenance = "contradictionary-tier1-shapes [T1S] shape 12; contradictionary [T0]"

[[pattern]]
id = "t0-hedge-preamble"
regex = "(?i)\\b(it'?s worth noting|important to note)\\b"
category = "claudian-filler"
action = "flag"
fp_risk = "low"
needs_case_insensitive = true
rationale = "Claudian hedge-preamble. If it's worth noting, note it."
provenance = "contradictionary [T0]"

[[pattern]]
id = "t0-performed-gratitude"
regex = "(?i)\\b(what a gift|I'?m so grateful|thank you for trusting me)\\b"
category = "poignant"
action = "flag"
fp_risk = "low"
needs_case_insensitive = true
rationale = "Performed gratitude — justifying enjoyment reads as sycophancy."
provenance = "contradictionary [T0]"

[[pattern]]
id = "t0-nagging"
regex = "(?i)\\b(don'?t forget to|make sure you|remember to)\\b"
category = "nagging"
action = "flag"
fp_risk = "high"
needs_case_insensitive = true
