[workspace]
members = [".", "crates/dione-rendering", "crates/dione-durable", "crates/dione-contracts", "crates/dione-rook", "crates/dione-attention", "crates/dione-evidence", "crates/dione-messages", "crates/dione-rate-limiter", "crates/dione-vaelii", "crates/dione-gaie", "crates/dione-identity-display", "crates/dione-harness", "crates/dione-presentation", "crates/dione-contradictionary", "crates/dione-bell-rings", "crates/dione-delivery-scheduler", "crates/dione-access-requests", "crates/dione-mutes", "crates/dione-coordination", "crates/dione-pre-send", "crates/dione-teams-identities"]

[package]
name = "dione"
version = "0.107.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Discord MCP channel server for Claude Code, Codex, and Oh My Pi"
repository = "https://github.com/butterflyskies/dione"
readme = "README.md"
keywords = ["discord", "mcp", "claude-code", "codex", "bot"]
categories = ["command-line-utilities"]

[workspace.dependencies]
dione-teams-identities = { version = "=0.1.0", path = "crates/dione-teams-identities" }
regex = "1"
dione-pre-send = { version = "=0.1.0", path = "crates/dione-pre-send" }
dione-coordination = { version = "=0.1.0", path = "crates/dione-coordination" }
arc-swap = "1"
dione-mutes = { version = "=0.1.0", path = "crates/dione-mutes" }
dione-access-requests = { version = "=0.1.0", path = "crates/dione-access-requests" }
dione-delivery-scheduler = { version = "=0.1.0", path = "crates/dione-delivery-scheduler" }
rmcp = { version = "1.1", features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
dione-bell-rings = { version = "=0.1.0", path = "crates/dione-bell-rings" }
aho-corasick = "1"
dione-contradictionary = { version = "=0.1.0", path = "crates/dione-contradictionary" }
dione-presentation = { version = "=0.1.0", path = "crates/dione-presentation" }
dione-harness = { version = "=0.1.0", path = "crates/dione-harness" }
serde_yaml_ng = "0.10"
dione-identity-display = { version = "=0.1.0", path = "crates/dione-identity-display" }
pretty_assertions = "1"
url = "2"
test-case = "3"
dione-gaie = { version = "=0.1.0", path = "crates/dione-gaie" }
dione-vaelii = { version = "=0.1.0", path = "crates/dione-vaelii" }
proptest = "1"
dione-rate-limiter = { version = "=0.1.0", path = "crates/dione-rate-limiter" }
chrono-tz = "0.10"
dione-messages = { version = "=0.2.0", path = "crates/dione-messages" }
base64 = "0.22"
dione-evidence = { version = "=0.1.0", path = "crates/dione-evidence" }
dione-attention = { version = "=0.1.0", path = "crates/dione-attention" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
dione-rook = { version = "=0.1.0", path = "crates/dione-rook" }
futures-util = "0.3"
secrecy = { version = "0.8", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
trybuild = "1"
dione-contracts = { version = "=0.1.0", path = "crates/dione-contracts" }
tracing = "0.1"
toml = "1"
libc = "0.2"
fs2 = "0.4"
camino = { version = "1", features = ["serde1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "fs", "io-util", "io-std", "net", "time"] }
dione-durable = { version = "=0.1.0", path = "crates/dione-durable" }
dione-rendering = { version = "=0.1.0", path = "crates/dione-rendering" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
native-tls = { version = "0.2", features = ["vendored"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
serde_path_to_error = "0.1"
png = "0.17.16"
thiserror = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
typst = "0.14.2"
typst-render = "0.14.2"
typst-assets = { version = "0.14.2", features = ["fonts"] }
typst-as-lib = "0.15.4"
mitex = "0.2.4"

serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "http", "native_tls_backend", "cache"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-util = { version = "0.7", features = ["rt"] }
[dependencies]
dione-teams-identities.workspace = true
dione-pre-send.workspace = true
dione-coordination.workspace = true
dione-mutes.workspace = true
dione-access-requests.workspace = true
dione-delivery-scheduler.workspace = true
dione-bell-rings.workspace = true
dione-contradictionary.workspace = true
dione-presentation.workspace = true
dione-harness.workspace = true
dione-identity-display.workspace = true
dione-gaie.workspace = true
dione-vaelii.workspace = true
dione-rate-limiter.workspace = true
dione-messages.workspace = true
dione-evidence.workspace = true
dione-attention.workspace = true
dione-rook.workspace = true
dione-contracts.workspace = true
dione-durable.workspace = true
dione-rendering.workspace = true
arc-swap.workspace = true
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
serenity.workspace = true
native-tls.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_path_to_error.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit = "0.25"
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
color-eyre = "0.6"
fs2.workspace = true
libc.workspace = true
regex.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
camino.workspace = true
futures-util.workspace = true
notify = "8"
reqwest.workspace = true
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
secrecy.workspace = true
url.workspace = true
sha2.workspace = true
uuid.workspace = true
tokio-tungstenite = { version = "0.21", default-features = false, features = ["handshake"] }
tempfile.workspace = true

[features]
# Compile-time test seam: lets the one-shot binary and `oneshot::run` be
# pointed at a mock Discord. NOT in default; production bytes have no
# endpoint override at all.
oneshot-test-seam = []

[dev-dependencies]
dione-attention = { workspace = true, features = ["test-support"] }
dione-rook = { workspace = true, features = ["test-support"] }
dione-durable = { workspace = true, features = ["test-support"] }
png.workspace = true
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.13"
rustls.workspace = true
tokio-rustls.workspace = true
insta = { version = "1", features = ["json", "redactions"] }
proptest.workspace = true
test-case.workspace = true
pretty_assertions.workspace = true
parking_lot = "0.12"
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "process"] }
trybuild.workspace = true

[profile.release]
lto = true
strip = true
codegen-units = 1

# Faster PR builds; the shipped binaries still use [profile.release].
[profile.review]
inherits = "release"
lto = "thin"
codegen-units = 16

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
