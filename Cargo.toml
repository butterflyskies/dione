[package]
name = "dione"
version = "0.15.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Discord MCP channel server for Claude Code"
repository = "https://github.com/butterflyskies/dione"
readme = "README.md"
keywords = ["discord", "mcp", "claude-code", "bot", "channel"]
categories = ["command-line-utilities"]

[dependencies]
arc-swap = "1"
clap = { version = "4", features = ["derive"] }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "http", "rustls_backend", "cache"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "fs", "io-util", "io-std", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
thiserror = "2"
color-eyre = "0.6"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
camino = { version = "1", features = ["serde1"] }
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
typst = "0.14.2"
typst-render = "0.14.2"
typst-assets = { version = "0.14.2", features = ["fonts"] }
typst-as-lib = "0.15.4"
mitex = "0.2.4"
tempfile = "3"

[dev-dependencies]
insta = { version = "1", features = ["json", "redactions"] }
proptest = "1"
test-case = "3"
pretty_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
