name: Publish Crate

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-crate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-auspex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      auspex-version: ${{ steps.package.outputs.auspex-version }}
      publish-auspex: ${{ steps.package.outputs.publish-auspex }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (2026-03-27)
        with:
          toolchain: stable
      - name: Verify Auspex package and namespace
        id: package
        run: |
          set -euo pipefail

          auspex_version="$(scripts/workspace-package-version.sh auspex-core)"
          auspex_crate="target/package/auspex-core-${auspex_version}.crate"
          cargo package -p auspex-core --locked
          scripts/verify-public-package-privacy.sh "${auspex_crate}"

          case "$(scripts/crates-io-package-state.sh auspex-core "${auspex_version}" "${auspex_crate}" --ignore-vcs-info)" in
            published)
              scripts/verify-crates-io-owners.sh auspex-core \
                butterflysky \
                github:butterflyskies:lacuna-blinkers \
                github:butterflyskies:superadmins
              echo "publish-auspex=false" >> "${GITHUB_OUTPUT}"
              ;;
            missing)
              if scripts/verify-crates-io-owners.sh auspex-core \
                butterflysky \
                github:butterflyskies:lacuna-blinkers \
                github:butterflyskies:superadmins; then
                echo "publish-auspex=true" >> "${GITHUB_OUTPUT}"
              else
                owner_status="$?"
                if [ "${owner_status}" = 3 ]; then
                  echo "::error::auspex-core needs its protected first publication" >&2
                  echo "Publish it once with a manually scoped crates.io token, set the exact owner allowlist, configure its trusted publisher, then rerun this release." >&2
                fi
                exit "${owner_status}"
              fi
              ;;
          esac
          echo "auspex-version=${auspex_version}" >> "${GITHUB_OUTPUT}"

  publish-auspex:
    needs: verify-auspex
    if: needs.verify-auspex.outputs.publish-auspex == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (2026-03-27)
        with:
          toolchain: stable
      - name: Recheck Auspex without executing package code
        id: preflight
        run: |
          set -euo pipefail

          auspex_version="$(scripts/workspace-package-version.sh auspex-core)"
          test "${auspex_version}" = "${{ needs.verify-auspex.outputs.auspex-version }}"
          cargo package -p auspex-core --locked --no-verify
          auspex_crate="target/package/auspex-core-${auspex_version}.crate"
          scripts/verify-public-package-privacy.sh "${auspex_crate}"
          scripts/verify-crates-io-owners.sh auspex-core \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins

          case "$(scripts/crates-io-package-state.sh auspex-core "${auspex_version}" "${auspex_crate}" --ignore-vcs-info)" in
            published) echo "upload=false" >> "${GITHUB_OUTPUT}" ;;
            missing) echo "upload=true" >> "${GITHUB_OUTPUT}" ;;
          esac
      - name: Authenticate with crates.io
        if: steps.preflight.outputs.upload == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Upload pre-verified Auspex package
        if: steps.preflight.outputs.upload == 'true'
        continue-on-error: true
        run: cargo publish -p auspex-core --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  reconcile-auspex:
    needs: [verify-auspex, publish-auspex]
    if: >-
      always() &&
      needs.verify-auspex.result == 'success' &&
      (needs.publish-auspex.result == 'success' || needs.publish-auspex.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (2026-03-27)
        with:
          toolchain: stable
      - name: Reconcile exact Auspex registry state
        run: |
          set -euo pipefail

          auspex_version="${{ needs.verify-auspex.outputs.auspex-version }}"
          for attempt in $(seq 1 20); do
            if timeout 10s cargo info --registry crates-io "auspex-core@${auspex_version}" > /dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" = 20 ]; then
              echo "Cargo could not resolve auspex-core ${auspex_version} after bounded retries" >&2
              exit 1
            fi
            sleep 5
          done

          cargo package -p auspex-core --locked
          auspex_crate="target/package/auspex-core-${auspex_version}.crate"
          scripts/verify-public-package-privacy.sh "${auspex_crate}"
          test "$(scripts/crates-io-package-state.sh auspex-core "${auspex_version}" "${auspex_crate}" --ignore-vcs-info)" = published
          scripts/verify-crates-io-owners.sh auspex-core \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins

  verify-dione:
    needs: [verify-auspex, reconcile-auspex]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      dione-version: ${{ steps.package.outputs.dione-version }}
      publish-dione: ${{ steps.package.outputs.publish-dione }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (2026-03-27)
        with:
          toolchain: stable
      - name: Verify registry-backed Dione package
        id: package
        run: |
          set -euo pipefail

          auspex_version="${{ needs.verify-auspex.outputs.auspex-version }}"
          for attempt in $(seq 1 20); do
            if timeout 10s cargo info --registry crates-io "auspex-core@${auspex_version}" > /dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" = 20 ]; then
              echo "Cargo could not resolve auspex-core ${auspex_version} after bounded retries" >&2
              exit 1
            fi
            sleep 5
          done

          cargo package -p auspex-core --locked
          auspex_crate="target/package/auspex-core-${auspex_version}.crate"
          scripts/verify-public-package-privacy.sh "${auspex_crate}"
          test "$(scripts/crates-io-package-state.sh auspex-core "${auspex_version}" "${auspex_crate}" --ignore-vcs-info)" = published
          scripts/verify-crates-io-owners.sh auspex-core \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins

          dione_version="$(scripts/workspace-package-version.sh dione)"
          dione_crate="target/package/dione-${dione_version}.crate"
          cargo package -p dione --locked
          scripts/verify-public-package-privacy.sh "${dione_crate}"
          scripts/verify-crates-io-owners.sh dione \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins

          case "$(scripts/crates-io-package-state.sh dione "${dione_version}" "${dione_crate}")" in
            published) echo "publish-dione=false" >> "${GITHUB_OUTPUT}" ;;
            missing) echo "publish-dione=true" >> "${GITHUB_OUTPUT}" ;;
          esac
          echo "dione-version=${dione_version}" >> "${GITHUB_OUTPUT}"

  publish-crate:
    needs: verify-dione
    if: needs.verify-dione.outputs.publish-dione == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (2026-03-27)
        with:
          toolchain: stable
      - name: Recheck exact Dione package state
        id: preflight
        run: |
          set -euo pipefail

          dione_version="$(scripts/workspace-package-version.sh dione)"
          test "${dione_version}" = "${{ needs.verify-dione.outputs.dione-version }}"
          cargo package -p dione --locked --no-verify
          dione_crate="target/package/dione-${dione_version}.crate"
          scripts/verify-public-package-privacy.sh "${dione_crate}"
          scripts/verify-crates-io-owners.sh dione \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins

          case "$(scripts/crates-io-package-state.sh dione "${dione_version}" "${dione_crate}")" in
            published)
              echo "Dione ${dione_version} was already published with matching bytes"
              echo "upload=false" >> "${GITHUB_OUTPUT}"
              ;;
            missing)
              echo "upload=true" >> "${GITHUB_OUTPUT}"
              ;;
          esac
      - name: Authenticate with crates.io
        if: steps.preflight.outputs.upload == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Upload pre-verified Dione package
        if: steps.preflight.outputs.upload == 'true'
        continue-on-error: true
        run: cargo publish -p dione --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  reconcile-dione:
    needs: [verify-dione, publish-crate]
    if: >-
      always() &&
      needs.verify-dione.result == 'success' &&
      (needs.publish-crate.result == 'success' || needs.publish-crate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (2026-03-27)
        with:
          toolchain: stable
      - name: Reconcile exact Dione registry state
        run: |
          set -euo pipefail

          dione_version="${{ needs.verify-dione.outputs.dione-version }}"
          for attempt in $(seq 1 20); do
            if timeout 10s cargo info --registry crates-io "dione@${dione_version}" > /dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" = 20 ]; then
              echo "Cargo could not resolve dione ${dione_version} after bounded retries" >&2
              exit 1
            fi
            sleep 5
          done

          cargo package -p dione --locked
          dione_crate="target/package/dione-${dione_version}.crate"
          scripts/verify-public-package-privacy.sh "${dione_crate}"
          test "$(scripts/crates-io-package-state.sh dione "${dione_version}" "${dione_crate}")" = published
          scripts/verify-crates-io-owners.sh dione \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins
