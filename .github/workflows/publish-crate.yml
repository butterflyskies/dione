      publish-discord-bells: ${{ steps.package.outputs.publish-discord-bells }}
      publish-discord-gate: ${{ steps.package.outputs.publish-discord-gate }}
      publish-oneshot: ${{ steps.package.outputs.publish-oneshot }}
      publish-harness-runtime: ${{ steps.package.outputs.publish-harness-runtime }}
      publish-discord-scheduling: ${{ steps.package.outputs.publish-discord-scheduling }}
      publish-discord-typing: ${{ steps.package.outputs.publish-discord-typing }}
      publish-discord-introspection: ${{ steps.package.outputs.publish-discord-introspection }}
      publish-discord-queries: ${{ steps.package.outputs.publish-discord-queries }}
      publish-attention-admission: ${{ steps.package.outputs.publish-attention-admission }}
      publish-discord-context: ${{ steps.package.outputs.publish-discord-context }}
      publish-discord-tool-arguments: ${{ steps.package.outputs.publish-discord-tool-arguments }}
