name: Publish Crate

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-crate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-dione:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      dione-version: ${{ steps.package.outputs.dione-version }}
      publish-dione: ${{ steps.package.outputs.publish-dione }}
      rendering-version: ${{ steps.package.outputs.rendering-version }}
      publish-rendering: ${{ steps.package.outputs.publish-rendering }}
      durable-version: ${{ steps.package.outputs.durable-version }}
      publish-durable: ${{ steps.package.outputs.publish-durable }}
      contracts-version: ${{ steps.package.outputs.contracts-version }}
      publish-contracts: ${{ steps.package.outputs.publish-contracts }}
      rook-version: ${{ steps.package.outputs.rook-version }}
      publish-rook: ${{ steps.package.outputs.publish-rook }}
      attention-version: ${{ steps.package.outputs.attention-version }}
      publish-attention: ${{ steps.package.outputs.publish-attention }}
      evidence-version: ${{ steps.package.outputs.evidence-version }}
      publish-evidence: ${{ steps.package.outputs.publish-evidence }}
      messages-version: ${{ steps.package.outputs.messages-version }}
      publish-messages: ${{ steps.package.outputs.publish-messages }}
      rate-limiter-version: ${{ steps.package.outputs.rate-limiter-version }}
      publish-rate-limiter: ${{ steps.package.outputs.publish-rate-limiter }}
      vaelii-version: ${{ steps.package.outputs.vaelii-version }}
      publish-vaelii: ${{ steps.package.outputs.publish-vaelii }}
      gaie-version: ${{ steps.package.outputs.gaie-version }}
      publish-gaie: ${{ steps.package.outputs.publish-gaie }}
      identity-display-version: ${{ steps.package.outputs.identity-display-version }}
      publish-identity-display: ${{ steps.package.outputs.publish-identity-display }}
      harness-version: ${{ steps.package.outputs.harness-version }}
      publish-harness: ${{ steps.package.outputs.publish-harness }}
      presentation-version: ${{ steps.package.outputs.presentation-version }}
      publish-presentation: ${{ steps.package.outputs.publish-presentation }}
      contradictionary-version: ${{ steps.package.outputs.contradictionary-version }}
      publish-contradictionary: ${{ steps.package.outputs.publish-contradictionary }}
      bell-rings-version: ${{ steps.package.outputs.bell-rings-version }}
      publish-bell-rings: ${{ steps.package.outputs.publish-bell-rings }}
      delivery-scheduler-version: ${{ steps.package.outputs.delivery-scheduler-version }}
      publish-delivery-scheduler: ${{ steps.package.outputs.publish-delivery-scheduler }}
      access-requests-version: ${{ steps.package.outputs.access-requests-version }}
      publish-access-requests: ${{ steps.package.outputs.publish-access-requests }}
      mutes-version: ${{ steps.package.outputs.mutes-version }}
      publish-mutes: ${{ steps.package.outputs.publish-mutes }}
      coordination-version: ${{ steps.package.outputs.coordination-version }}
      publish-coordination: ${{ steps.package.outputs.publish-coordination }}
      teams-identities-version: ${{ steps.package.outputs.teams-identities-version }}
      publish-teams-identities: ${{ steps.package.outputs.publish-teams-identities }}
      discord-identities-version: ${{ steps.package.outputs.discord-identities-version }}
      publish-discord-identities: ${{ steps.package.outputs.publish-discord-identities }}
      pluralkit-identities-version: ${{ steps.package.outputs.pluralkit-identities-version }}
      publish-pluralkit-identities: ${{ steps.package.outputs.publish-pluralkit-identities }}
      mcp-tools-version: ${{ steps.package.outputs.mcp-tools-version }}
      publish-mcp-tools: ${{ steps.package.outputs.publish-mcp-tools }}
      discord-presence-version: ${{ steps.package.outputs.discord-presence-version }}
      discord-state-version: ${{ steps.package.outputs.discord-state-version }}
      discord-events-version: ${{ steps.package.outputs.discord-events-version }}
      tracing-channel-version: ${{ steps.package.outputs.tracing-channel-version }}
      config-watcher-version: ${{ steps.package.outputs.config-watcher-version }}
      publish-discord-presence: ${{ steps.package.outputs.publish-discord-presence }}
      publish-discord-state: ${{ steps.package.outputs.publish-discord-state }}
      publish-discord-events: ${{ steps.package.outputs.publish-discord-events }}
      publish-tracing-channel: ${{ steps.package.outputs.publish-tracing-channel }}
      publish-config-watcher: ${{ steps.package.outputs.publish-config-watcher }}
      provider-delivery-version: ${{ steps.package.outputs.provider-delivery-version }}
      publish-provider-delivery: ${{ steps.package.outputs.publish-provider-delivery }}
      teams-version: ${{ steps.package.outputs.teams-version }}
      publish-teams: ${{ steps.package.outputs.publish-teams }}
      omp-version: ${{ steps.package.outputs.omp-version }}
      codex-version: ${{ steps.package.outputs.codex-version }}
      claude-version: ${{ steps.package.outputs.claude-version }}
      publish-omp: ${{ steps.package.outputs.publish-omp }}
      publish-codex: ${{ steps.package.outputs.publish-codex }}
      publish-claude: ${{ steps.package.outputs.publish-claude }}
      pre-send-version: ${{ steps.package.outputs.pre-send-version }}
      publish-pre-send: ${{ steps.package.outputs.publish-pre-send }}
      outbound-consent-version: ${{ steps.package.outputs.outbound-consent-version }}
      publish-outbound-consent: ${{ steps.package.outputs.publish-outbound-consent }}
      config-version: ${{ steps.package.outputs.config-version }}
      publish-config: ${{ steps.package.outputs.publish-config }}
