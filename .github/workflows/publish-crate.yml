          done

          cargo package -p dione-contracts --locked
          contracts_crate="target/package/dione-contracts-${contracts_version}.crate"
          scripts/verify-public-package-privacy.sh "${contracts_crate}"
          test "$(scripts/crates-io-package-state.sh dione-contracts "${contracts_version}" "${contracts_crate}" --ignore-vcs-info)" = published
          scripts/verify-crates-io-owners.sh dione-contracts \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins

  publish-rook:
    needs: [verify-dione, reconcile-durable, reconcile-contracts]
    if: needs.verify-dione.outputs.publish-rook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
