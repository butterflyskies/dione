name: Publish Crate

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-crate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-dione:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      dione-version: ${{ steps.package.outputs.dione-version }}
      publish-dione: ${{ steps.package.outputs.publish-dione }}
      rendering-version: ${{ steps.package.outputs.rendering-version }}
      publish-rendering: ${{ steps.package.outputs.publish-rendering }}
      durable-version: ${{ steps.package.outputs.durable-version }}
      publish-durable: ${{ steps.package.outputs.publish-durable }}
      contracts-version: ${{ steps.package.outputs.contracts-version }}
      publish-contracts: ${{ steps.package.outputs.publish-contracts }}
      rook-version: ${{ steps.package.outputs.rook-version }}
      publish-rook: ${{ steps.package.outputs.publish-rook }}
      attention-version: ${{ steps.package.outputs.attention-version }}
      publish-attention: ${{ steps.package.outputs.publish-attention }}
      evidence-version: ${{ steps.package.outputs.evidence-version }}
      publish-evidence: ${{ steps.package.outputs.publish-evidence }}
      messages-version: ${{ steps.package.outputs.messages-version }}
      publish-messages: ${{ steps.package.outputs.publish-messages }}
      rate-limiter-version: ${{ steps.package.outputs.rate-limiter-version }}
      publish-rate-limiter: ${{ steps.package.outputs.publish-rate-limiter }}
      vaelii-version: ${{ steps.package.outputs.vaelii-version }}
      publish-vaelii: ${{ steps.package.outputs.publish-vaelii }}
      gaie-version: ${{ steps.package.outputs.gaie-version }}
      publish-gaie: ${{ steps.package.outputs.publish-gaie }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
      - name: Verify workspace packages and namespaces
        id: package
        run: |
          set -euo pipefail

          dione_version="$(scripts/workspace-package-version.sh dione)"
          dione_crate="target/package/dione-${dione_version}.crate"
          cargo package --workspace --locked
          scripts/verify-public-package-privacy.sh "${dione_crate}"
          scripts/verify-crates-io-owners.sh dione \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins

          package_state="$(scripts/crates-io-package-state.sh dione "${dione_version}" "${dione_crate}")"
          case "$package_state" in
            published) echo "publish-dione=false" >> "${GITHUB_OUTPUT}" ;;
            missing) echo "publish-dione=true" >> "${GITHUB_OUTPUT}" ;;
          esac
          echo "dione-version=${dione_version}" >> "${GITHUB_OUTPUT}"

          rendering_version="$(scripts/workspace-package-version.sh dione-rendering)"
          rendering_crate="target/package/dione-rendering-${rendering_version}.crate"
          scripts/verify-public-package-privacy.sh "${rendering_crate}"
          scripts/verify-crates-io-owners.sh dione-rendering \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins
          package_state="$(scripts/crates-io-package-state.sh dione-rendering "${rendering_version}" "${rendering_crate}" --ignore-vcs-info)"
          case "$package_state" in
            published) echo "publish-rendering=false" >> "${GITHUB_OUTPUT}" ;;
            missing) echo "publish-rendering=true" >> "${GITHUB_OUTPUT}" ;;
          esac
          echo "rendering-version=${rendering_version}" >> "${GITHUB_OUTPUT}"

          durable_version="$(scripts/workspace-package-version.sh dione-durable)"
          durable_crate="target/package/dione-durable-${durable_version}.crate"
          scripts/verify-public-package-privacy.sh "${durable_crate}"
          scripts/verify-crates-io-owners.sh dione-durable \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins
          package_state="$(scripts/crates-io-package-state.sh dione-durable "${durable_version}" "${durable_crate}" --ignore-vcs-info)"
          case "$package_state" in
            published) echo "publish-durable=false" >> "${GITHUB_OUTPUT}" ;;
            missing) echo "publish-durable=true" >> "${GITHUB_OUTPUT}" ;;
          esac
          echo "durable-version=${durable_version}" >> "${GITHUB_OUTPUT}"

          contracts_version="$(scripts/workspace-package-version.sh dione-contracts)"
          contracts_crate="target/package/dione-contracts-${contracts_version}.crate"
          scripts/verify-public-package-privacy.sh "${contracts_crate}"
          scripts/verify-crates-io-owners.sh dione-contracts \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins
          package_state="$(scripts/crates-io-package-state.sh dione-contracts "${contracts_version}" "${contracts_crate}" --ignore-vcs-info)"
          case "$package_state" in
            published) echo "publish-contracts=false" >> "${GITHUB_OUTPUT}" ;;
            missing) echo "publish-contracts=true" >> "${GITHUB_OUTPUT}" ;;
          esac
          echo "contracts-version=${contracts_version}" >> "${GITHUB_OUTPUT}"
          rook_version="$(scripts/workspace-package-version.sh dione-rook)"
          rook_crate="target/package/dione-rook-${rook_version}.crate"
          scripts/verify-public-package-privacy.sh "${rook_crate}"
          scripts/verify-crates-io-owners.sh dione-rook \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins
          package_state="$(scripts/crates-io-package-state.sh dione-rook "${rook_version}" "${rook_crate}" --ignore-vcs-info)"
          case "$package_state" in
            published) echo "publish-rook=false" >> "${GITHUB_OUTPUT}" ;;
            missing) echo "publish-rook=true" >> "${GITHUB_OUTPUT}" ;;
          esac
          echo "rook-version=${rook_version}" >> "${GITHUB_OUTPUT}"

          attention_version="$(scripts/workspace-package-version.sh dione-attention)"
          attention_crate="target/package/dione-attention-${attention_version}.crate"
          scripts/verify-public-package-privacy.sh "${attention_crate}"
          scripts/verify-crates-io-owners.sh dione-attention \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins
          package_state="$(scripts/crates-io-package-state.sh dione-attention "${attention_version}" "${attention_crate}" --ignore-vcs-info)"
          case "$package_state" in
            published) echo "publish-attention=false" >> "${GITHUB_OUTPUT}" ;;
            missing) echo "publish-attention=true" >> "${GITHUB_OUTPUT}" ;;
          esac
          echo "attention-version=${attention_version}" >> "${GITHUB_OUTPUT}"

          evidence_version="$(scripts/workspace-package-version.sh dione-evidence)"
          evidence_crate="target/package/dione-evidence-${evidence_version}.crate"
          scripts/verify-public-package-privacy.sh "${evidence_crate}"
          scripts/verify-crates-io-owners.sh dione-evidence \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins
          package_state="$(scripts/crates-io-package-state.sh dione-evidence "${evidence_version}" "${evidence_crate}" --ignore-vcs-info)"
          case "$package_state" in
            published) echo "publish-evidence=false" >> "${GITHUB_OUTPUT}" ;;
            missing) echo "publish-evidence=true" >> "${GITHUB_OUTPUT}" ;;
          esac
          echo "evidence-version=${evidence_version}" >> "${GITHUB_OUTPUT}"

          messages_version="$(scripts/workspace-package-version.sh dione-messages)"
          messages_crate="target/package/dione-messages-${messages_version}.crate"
          scripts/verify-public-package-privacy.sh "${messages_crate}"
          scripts/verify-crates-io-owners.sh dione-messages \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins
          package_state="$(scripts/crates-io-package-state.sh dione-messages "${messages_version}" "${messages_crate}" --ignore-vcs-info)"
          case "$package_state" in
            published) echo "publish-messages=false" >> "${GITHUB_OUTPUT}" ;;
            missing) echo "publish-messages=true" >> "${GITHUB_OUTPUT}" ;;
          esac
          echo "messages-version=${messages_version}" >> "${GITHUB_OUTPUT}"

          rate_limiter_version="$(scripts/workspace-package-version.sh dione-rate-limiter)"
          rate_limiter_crate="target/package/dione-rate-limiter-${rate_limiter_version}.crate"
          scripts/verify-public-package-privacy.sh "${rate_limiter_crate}"
          scripts/verify-crates-io-owners.sh dione-rate-limiter \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins
          package_state="$(scripts/crates-io-package-state.sh dione-rate-limiter "${rate_limiter_version}" "${rate_limiter_crate}" --ignore-vcs-info)"
          case "$package_state" in
            published) echo "publish-rate-limiter=false" >> "${GITHUB_OUTPUT}" ;;
            missing) echo "publish-rate-limiter=true" >> "${GITHUB_OUTPUT}" ;;
          esac
          echo "rate-limiter-version=${rate_limiter_version}" >> "${GITHUB_OUTPUT}"

          vaelii_version="$(scripts/workspace-package-version.sh dione-vaelii)"
          vaelii_crate="target/package/dione-vaelii-${vaelii_version}.crate"
          scripts/verify-public-package-privacy.sh "${vaelii_crate}"
          scripts/verify-crates-io-owners.sh dione-vaelii \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins
          package_state="$(scripts/crates-io-package-state.sh dione-vaelii "${vaelii_version}" "${vaelii_crate}" --ignore-vcs-info)"
          case "$package_state" in
            published) echo "publish-vaelii=false" >> "${GITHUB_OUTPUT}" ;;
            missing) echo "publish-vaelii=true" >> "${GITHUB_OUTPUT}" ;;
          esac
          echo "vaelii-version=${vaelii_version}" >> "${GITHUB_OUTPUT}"

          gaie_version="$(scripts/workspace-package-version.sh dione-gaie)"
          gaie_crate="target/package/dione-gaie-${gaie_version}.crate"
          scripts/verify-public-package-privacy.sh "${gaie_crate}"
          scripts/verify-crates-io-owners.sh dione-gaie \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins
          package_state="$(scripts/crates-io-package-state.sh dione-gaie "${gaie_version}" "${gaie_crate}" --ignore-vcs-info)"
          case "$package_state" in
            published) echo "publish-gaie=false" >> "${GITHUB_OUTPUT}" ;;
            missing) echo "publish-gaie=true" >> "${GITHUB_OUTPUT}" ;;
          esac
          echo "gaie-version=${gaie_version}" >> "${GITHUB_OUTPUT}"

  publish-rendering:
    needs: verify-dione
    if: needs.verify-dione.outputs.publish-rendering == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.98.0"
      - name: Recheck rendering package contents
        id: preflight
        run: |
          set -euo pipefail

          rendering_version="$(scripts/workspace-package-version.sh dione-rendering)"
          test "${rendering_version}" = "${{ needs.verify-dione.outputs.rendering-version }}"
          cargo package -p dione-rendering --locked --no-verify
          rendering_crate="target/package/dione-rendering-${rendering_version}.crate"
          scripts/verify-public-package-privacy.sh "${rendering_crate}"
          scripts/verify-crates-io-owners.sh dione-rendering \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins

          package_state="$(scripts/crates-io-package-state.sh dione-rendering "${rendering_version}" "${rendering_crate}" --ignore-vcs-info)"
          case "$package_state" in
            published)
              echo "rendering ${rendering_version} was already published with matching contents"
              echo "upload=false" >> "${GITHUB_OUTPUT}"
              ;;
            missing)
              echo "upload=true" >> "${GITHUB_OUTPUT}"
              ;;
          esac
      - name: Authenticate with crates.io
        if: steps.preflight.outputs.upload == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: auth
      - name: Upload pre-verified rendering package
        if: steps.preflight.outputs.upload == 'true'
        continue-on-error: true
        run: cargo publish -p dione-rendering --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  reconcile-rendering:
    needs: [verify-dione, publish-rendering]
    if: >-
      always() &&
      needs.verify-dione.result == 'success' &&
      (needs.publish-rendering.result == 'success' || needs.publish-rendering.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.98.0"
      - name: Reconcile rendering registry contents
        run: |
          set -euo pipefail

          rendering_version="${{ needs.verify-dione.outputs.rendering-version }}"
          for attempt in $(seq 1 20); do
            if timeout 10s cargo info --registry crates-io "dione-rendering@${rendering_version}" > /dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" = 20 ]; then
              echo "Cargo could not resolve dione-rendering ${rendering_version} after bounded retries" >&2
              exit 1
            fi
            sleep 5
          done

          cargo package -p dione-rendering --locked
          rendering_crate="target/package/dione-rendering-${rendering_version}.crate"
          scripts/verify-public-package-privacy.sh "${rendering_crate}"
          test "$(scripts/crates-io-package-state.sh dione-rendering "${rendering_version}" "${rendering_crate}" --ignore-vcs-info)" = published
          scripts/verify-crates-io-owners.sh dione-rendering \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins

  publish-durable:
