    if: needs.verify-dione.outputs.publish-durable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.98.0"
      - name: Recheck durable package contents
        id: preflight
        run: |
          set -euo pipefail

          durable_version="$(scripts/workspace-package-version.sh dione-durable)"
          test "${durable_version}" = "${{ needs.verify-dione.outputs.durable-version }}"
          cargo package -p dione-durable --locked --no-verify
          durable_crate="target/package/dione-durable-${durable_version}.crate"
          scripts/verify-public-package-privacy.sh "${durable_crate}"
          scripts/verify-crates-io-owners.sh dione-durable \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins

          package_state="$(scripts/crates-io-package-state.sh dione-durable "${durable_version}" "${durable_crate}" --ignore-vcs-info)"
          case "$package_state" in
            published)
              echo "durable ${durable_version} was already published with matching contents"
              echo "upload=false" >> "${GITHUB_OUTPUT}"
              ;;
            missing)
              echo "upload=true" >> "${GITHUB_OUTPUT}"
              ;;
          esac
      - name: Authenticate with crates.io
        if: steps.preflight.outputs.upload == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: auth
      - name: Upload pre-verified durable package
        if: steps.preflight.outputs.upload == 'true'
        continue-on-error: true
        run: cargo publish -p dione-durable --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  reconcile-durable:
    needs: [verify-dione, publish-durable]
    if: >-
      always() &&
      needs.verify-dione.result == 'success' &&
      (needs.publish-durable.result == 'success' || needs.publish-durable.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.98.0"
      - name: Reconcile durable registry contents
        run: |
          set -euo pipefail

          durable_version="${{ needs.verify-dione.outputs.durable-version }}"
          for attempt in $(seq 1 20); do
            if timeout 10s cargo info --registry crates-io "dione-durable@${durable_version}" > /dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" = 20 ]; then
              echo "Cargo could not resolve dione-durable ${durable_version} after bounded retries" >&2
              exit 1
            fi
            sleep 5
          done

          cargo package -p dione-durable --locked
          durable_crate="target/package/dione-durable-${durable_version}.crate"
          scripts/verify-public-package-privacy.sh "${durable_crate}"
          test "$(scripts/crates-io-package-state.sh dione-durable "${durable_version}" "${durable_crate}" --ignore-vcs-info)" = published
          scripts/verify-crates-io-owners.sh dione-durable \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins

  publish-contracts:
    needs: verify-dione
    if: needs.verify-dione.outputs.publish-contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.98.0"
      - name: Recheck contracts package contents
        id: preflight
        run: |
          set -euo pipefail

          contracts_version="$(scripts/workspace-package-version.sh dione-contracts)"
          test "${contracts_version}" = "${{ needs.verify-dione.outputs.contracts-version }}"
          cargo package -p dione-contracts --locked --no-verify
          contracts_crate="target/package/dione-contracts-${contracts_version}.crate"
          scripts/verify-public-package-privacy.sh "${contracts_crate}"
          scripts/verify-crates-io-owners.sh dione-contracts \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins

          package_state="$(scripts/crates-io-package-state.sh dione-contracts "${contracts_version}" "${contracts_crate}" --ignore-vcs-info)"
          case "$package_state" in
            published)
              echo "contracts ${contracts_version} was already published with matching contents"
              echo "upload=false" >> "${GITHUB_OUTPUT}"
              ;;
            missing)
              echo "upload=true" >> "${GITHUB_OUTPUT}"
              ;;
          esac
      - name: Authenticate with crates.io
        if: steps.preflight.outputs.upload == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: auth
      - name: Upload pre-verified contracts package
        if: steps.preflight.outputs.upload == 'true'
        continue-on-error: true
        run: cargo publish -p dione-contracts --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  reconcile-contracts:
    needs: [verify-dione, publish-contracts]
    if: >-
      always() &&
      needs.verify-dione.result == 'success' &&
      (needs.publish-contracts.result == 'success' || needs.publish-contracts.result == 'skipped')
