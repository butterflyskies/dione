      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.98.0"
      - name: Reconcile gaie registry contents
        run: |
          set -euo pipefail

          gaie_version="${{ needs.verify-dione.outputs.gaie-version }}"
          for attempt in $(seq 1 20); do
            if timeout 10s cargo info --registry crates-io "dione-gaie@${gaie_version}" > /dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" = 20 ]; then
              echo "Cargo could not resolve dione-gaie ${gaie_version} after bounded retries" >&2
              exit 1
            fi
            sleep 5
          done

          cargo package -p dione-gaie --locked
          gaie_crate="target/package/dione-gaie-${gaie_version}.crate"
          scripts/verify-public-package-privacy.sh "${gaie_crate}"
          test "$(scripts/crates-io-package-state.sh dione-gaie "${gaie_version}" "${gaie_crate}" --ignore-vcs-info)" = published
          scripts/verify-crates-io-owners.sh dione-gaie \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins

  publish-crate:
    needs: [verify-dione, reconcile-rendering, reconcile-durable, reconcile-contracts, reconcile-rook, reconcile-attention, reconcile-evidence, reconcile-messages, reconcile-rate-limiter, reconcile-vaelii, reconcile-gaie]
    if: needs.verify-dione.outputs.publish-dione == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
      - name: Recheck exact Dione package state
        id: preflight
        run: |
          set -euo pipefail

          dione_version="$(scripts/workspace-package-version.sh dione)"
          test "${dione_version}" = "${{ needs.verify-dione.outputs.dione-version }}"
          cargo package -p dione --locked --no-verify
          dione_crate="target/package/dione-${dione_version}.crate"
          scripts/verify-public-package-privacy.sh "${dione_crate}"
          scripts/verify-crates-io-owners.sh dione \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins

          package_state="$(scripts/crates-io-package-state.sh dione "${dione_version}" "${dione_crate}")"
          case "$package_state" in
            published)
              echo "Dione ${dione_version} was already published with matching bytes"
              echo "upload=false" >> "${GITHUB_OUTPUT}"
              ;;
            missing)
              echo "upload=true" >> "${GITHUB_OUTPUT}"
              ;;
          esac
      - name: Authenticate with crates.io
        if: steps.preflight.outputs.upload == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Upload pre-verified Dione package
        if: steps.preflight.outputs.upload == 'true'
        continue-on-error: true
        run: cargo publish -p dione --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  reconcile-dione:
    needs: [verify-dione, reconcile-rendering, reconcile-durable, reconcile-contracts, reconcile-rook, reconcile-attention, reconcile-evidence, reconcile-messages, reconcile-rate-limiter, reconcile-vaelii, reconcile-gaie, publish-crate]
    if: >-
      always() &&
      needs.verify-dione.result == 'success' &&
      needs.reconcile-rendering.result == 'success' &&
      needs.reconcile-durable.result == 'success' &&
      needs.reconcile-contracts.result == 'success' &&
      needs.reconcile-rook.result == 'success' &&
      needs.reconcile-attention.result == 'success' &&
      needs.reconcile-evidence.result == 'success' &&
      needs.reconcile-messages.result == 'success' &&
      needs.reconcile-rate-limiter.result == 'success' &&
      needs.reconcile-vaelii.result == 'success' &&
      needs.reconcile-gaie.result == 'success' &&
      (needs.publish-crate.result == 'success' || needs.publish-crate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
      - name: Reconcile exact Dione registry state
        run: |
          set -euo pipefail

          dione_version="${{ needs.verify-dione.outputs.dione-version }}"
          for attempt in $(seq 1 20); do
            if timeout 10s cargo info --registry crates-io "dione@${dione_version}" > /dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" = 20 ]; then
              echo "Cargo could not resolve dione ${dione_version} after bounded retries" >&2
              exit 1
            fi
            sleep 5
          done

          cargo package -p dione --locked
          dione_crate="target/package/dione-${dione_version}.crate"
          scripts/verify-public-package-privacy.sh "${dione_crate}"
          test "$(scripts/crates-io-package-state.sh dione "${dione_version}" "${dione_crate}")" = published
          scripts/verify-crates-io-owners.sh dione \
            butterflysky \
            github:butterflyskies:lacuna-blinkers \
            github:butterflyskies:superadmins
