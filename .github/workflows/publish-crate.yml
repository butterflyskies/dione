          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
      - name: Verify workspace packages and namespaces
        id: package
        run: |
          set -euo pipefail

          dione_version="$(scripts/workspace-package-version.sh dione)"
          dione_crate="target/package/dione-${dione_version}.crate"
          cargo package --workspace --locked
          sh scripts/package-preflight.sh dione "${dione_version}" "${dione_crate}" exact verify "${GITHUB_OUTPUT}" publish-dione butterflysky github:butterflyskies:lacuna-blinkers github:butterflyskies:superadmins
