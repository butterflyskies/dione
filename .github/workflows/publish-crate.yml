      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
      - name: Reconcile exact Dione registry state
        run: |
          set -euo pipefail

          dione_version="${{ needs.verify-dione.outputs.dione-version }}"
          for attempt in $(seq 1 20); do
            if timeout 10s cargo info --registry crates-io "dione@${dione_version}" > /dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" = 20 ]; then
              echo "Cargo could not resolve dione ${dione_version} after bounded retries" >&2
              exit 1
            fi
            sleep 5
          done

          cargo package -p dione --locked
          dione_crate="target/package/dione-${dione_version}.crate"
          sh scripts/package-preflight.sh dione "${dione_version}" "${dione_crate}" exact reconcile - - butterflysky github:butterflyskies:lacuna-blinkers github:butterflyskies:superadmins
