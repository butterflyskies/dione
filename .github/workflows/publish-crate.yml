      permissions-version: ${{ steps.package.outputs.permissions-version }}
      discord-bells-version: ${{ steps.package.outputs.discord-bells-version }}
      discord-gate-version: ${{ steps.package.outputs.discord-gate-version }}
      oneshot-version: ${{ steps.package.outputs.oneshot-version }}
      harness-runtime-version: ${{ steps.package.outputs.harness-runtime-version }}
      discord-scheduling-version: ${{ steps.package.outputs.discord-scheduling-version }}
      discord-typing-version: ${{ steps.package.outputs.discord-typing-version }}
      discord-introspection-version: ${{ steps.package.outputs.discord-introspection-version }}
      discord-queries-version: ${{ steps.package.outputs.discord-queries-version }}
      attention-admission-version: ${{ steps.package.outputs.attention-admission-version }}
