name: Release Hygiene

# Pull requests compare their declared base and head commits. Main pushes keep
# the post-merge tripwire as defense in depth. Neither path executes repository
# code beyond this fixed metadata check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: release-hygiene-${{ forgejo.ref }}
  cancel-in-progress: false

jobs:
  hygiene:
    name: Version + changelog accompany source changes
    runs-on: docker
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require version bump + changelog entry when src/ changes
        env:
          EVENT_NAME: ${{ forgejo.event_name }}
          PR_BASE: ${{ forgejo.event.pull_request.base.sha }}
          PR_HEAD: ${{ forgejo.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ forgejo.event.before }}
          PUSH_AFTER: ${{ forgejo.sha }}
        run: sh .forgejo/scripts/release-hygiene.sh
