name: Forgejo Linux CI

# Forgejo pull-request runs execute only the non-mutating checks below. The
# release tag remains a trusted-main job and is guarded at the job boundary.
# This mirrors the Linux build from GitHub CI, but omits GitHub's macOS runner,
# release creation, and package publishing. The main-only tag job follows the
# eight checks and checks the version and changelog bump before tagging.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Checkout credentials are discarded before repository code runs. Every
# repository-mutating step remains outside the pull-request path.

concurrency:
  group: forgejo-linux-${{ forgejo.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: Release hygiene
    runs-on: docker
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require version bump + changelog entry when src/ changes
        env:
          EVENT_NAME: ${{ forgejo.event_name }}
          PR_BASE: ${{ forgejo.event.pull_request.base.sha }}
          PR_HEAD: ${{ forgejo.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ forgejo.event.before }}
          PUSH_AFTER: ${{ forgejo.sha }}
        run: sh .forgejo/scripts/release-hygiene.sh

  format:
    name: Formatting
    runs-on: docker
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
          components: rustfmt
      - run: cargo fmt -- --check

  lint:
    name: Clippy
    runs-on: docker
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --features oneshot-test-seam -- -D warnings

  test:
    name: Tests
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
      - name: Install cargo-nextest
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 5 --max-time 120 --retry 3 --retry-all-errors \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.136/cargo-nextest-0.9.136-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/cargo-nextest.tar.gz
          echo "a098eed56f2dd88c7fdca1e554a6b99fa1ffbd2a7a1c41b865700112981f6f52  /tmp/cargo-nextest.tar.gz" | sha256sum -c -
          tar xzf /tmp/cargo-nextest.tar.gz -C /usr/local/bin
      - run: cargo nextest run --workspace --locked --no-fail-fast --features oneshot-test-seam
      # Production feature set: proves the endpoint-override seam is absent.
      - run: cargo nextest run --workspace --locked --no-fail-fast --test oneshot_send
      - name: Test trusted review receipt checker
        run: python3 -B -m unittest discover -s .forgejo/scripts -p 'test_*.py'

  package:
    name: Public package boundary
    runs-on: docker
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
      - name: Reject private and git-backed package sources
        run: cargo test --test public_package --locked
      - name: Verify publishable Dione package
        run: |
          cargo package -p dione --locked
          dione_version="$(scripts/workspace-package-version.sh dione)"
          dione_crate="target/package/dione-${dione_version}.crate"
          scripts/verify-public-package-privacy.sh "${dione_crate}"

  msrv:
    name: Rust 1.98 minimum supported version
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
      - run: cargo +1.98.0 check --workspace --all-targets --locked

  build:
    name: Release binaries
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
      - run: cargo build --release --workspace --bins --locked
      - run: ./target/release/dione --version

  audit:
    name: Dependency audit
    runs-on: docker
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  required:
    name: Required checks
    needs: [hygiene, format, lint, test, package, msrv, build, audit]
    if: ${{ always() }}
    runs-on: docker
    timeout-minutes: 5
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require every check to succeed
        run: |
          sh .forgejo/scripts/require-successful-checks.sh \
            "hygiene=${{ needs.hygiene.result }}" \
            "format=${{ needs.format.result }}" \
            "lint=${{ needs.lint.result }}" \
            "test=${{ needs.test.result }}" \
            "package=${{ needs.package.result }}" \
            "msrv=${{ needs.msrv.result }}" \
            "build=${{ needs.build.result }}" \
            "audit=${{ needs.audit.result }}"

  release-tag:
    name: Annotated release tag
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    # The release account's integration is restricted to this workflow,
    # main, and push events. Other jobs cannot request its JWT.
    enable-openid-connect: true
    needs: [required]
    runs-on: docker
    timeout-minutes: 15
    steps:
      - uses: https://github.com/dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ forgejo.sha }}
          persist-credentials: false
      - name: Tag a qualified version and changelog bump
        env:
          # Use the installed base toolchain for cargo pkgid without downloading
          # the rustfmt and clippy components from rust-toolchain.toml again.
          RUSTUP_TOOLCHAIN: "1.98.0"
          EXPECTED_COMMIT: ${{ forgejo.sha }}
          PUSH_BEFORE: ${{ forgejo.event.before }}
          RELEASE_AUTH_MODE: oidc
          RELEASE_AUDIENCE: ${{ vars.DIONE_RELEASE_AUDIENCE }}
          RELEASE_REMOTE_URL: ${{ forgejo.server_url }}/${{ forgejo.repository }}.git
        run: sh scripts/tag-qualified-release.sh
