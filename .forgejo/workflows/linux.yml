name: Forgejo Linux CI

# Forgejo pull-request runs execute only the non-mutating checks below. The
# release tag remains a trusted-main job and is guarded at the job boundary.
# This mirrors the Linux build from GitHub CI, but omits GitHub's macOS runner,
# release creation, and package publishing. The main-only tag job follows the
# eight checks and checks the version and changelog bump before tagging.
on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - refactor/plugin-crates
      - "refactor/*-crate"
      - refactor/vertical-slices
      - refactor/teams-identities-publication
      - fix/reply-secure-publication
      - publication/secure-management-tools
      - publication/secure-query-tools
      - publication/secure-reply-teams-base
      - refactor/owned-durable-admission
      - refactor/discord-query-observation-errors
      - refactor/generic-durable-store
      - feat/rook-event-ingress

# Checkout credentials are discarded before repository code runs. Every
# repository-mutating step remains outside the pull-request path.

concurrency:
  group: forgejo-linux-${{ forgejo.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: Release hygiene
    runs-on: docker
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require version bump + changelog entry when src/ changes
        env:
          EVENT_NAME: ${{ forgejo.event_name }}
          PR_BASE: ${{ forgejo.event.pull_request.base.sha }}
          PR_HEAD: ${{ forgejo.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ forgejo.event.before }}
          PUSH_AFTER: ${{ forgejo.sha }}
        run: sh .forgejo/scripts/release-hygiene.sh

  format:
    name: Formatting
    runs-on: docker
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint:
    name: Clippy
    runs-on: docker
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --features oneshot-test-seam -- -D warnings

  test:
    name: Tests
    runs-on: docker
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      # CI does not need incremental recompilation state or full debugger data.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
      - name: Install cargo-nextest
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 5 --max-time 120 --retry 3 --retry-all-errors \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.136/cargo-nextest-0.9.136-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/cargo-nextest.tar.gz
          echo "a098eed56f2dd88c7fdca1e554a6b99fa1ffbd2a7a1c41b865700112981f6f52  /tmp/cargo-nextest.tar.gz" | sha256sum -c -
          tar xzf /tmp/cargo-nextest.tar.gz -C /usr/local/bin
      - name: Record storage before tests
        run: df -h .
      - name: Record resource counters before Nextest
        run: |
          python3 -B .forgejo/scripts/ci-resource-snapshot.py before-nextest ||
            printf '%s\n' '{"schema":"dione-ci-resources-v1","phase":"before-nextest","status":"unknown","reason":"snapshot-helper-failed"}'
      - name: Run full suite including compile-time contracts
        run: python3 scripts/run-tests.py --workspace --locked --no-fail-fast --features oneshot-test-seam
      - name: Record resource counters after Nextest
        if: ${{ always() }}
        run: |
          python3 -B .forgejo/scripts/ci-resource-snapshot.py after-nextest ||
            printf '%s\n' '{"schema":"dione-ci-resources-v1","phase":"after-nextest","status":"unknown","reason":"snapshot-helper-failed"}'
      - name: Record storage after feature suite
        if: ${{ always() }}
        run: |
          df -h .
          if [ -d target ]; then du -h -d 2 target; fi
      # Production feature set: proves the endpoint-override seam is absent.
      - name: Verify production oneshot behavior
        run: python3 scripts/run-tests.py --workspace --locked --no-fail-fast --test oneshot_send
      - name: Check rendering public API contracts
        run: cargo test --workspace --doc --locked
      - name: Record storage after production tests
        if: ${{ always() }}
        run: |
          df -h .
          if [ -d target ]; then du -h -d 2 target; fi
      - name: Test trusted review receipt checker
        run: python3 -B -m unittest discover -s .forgejo/scripts -p 'test_*.py'

  package:
    name: Public package boundary
    runs-on: docker
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
      - name: Reject private and git-backed package sources
        run: cargo test --test public_package --locked
      - name: Verify publishable workspace packages
        run: |
          cargo package --workspace --locked
          dione_version="$(scripts/workspace-package-version.sh dione)"
          dione_crate="target/package/dione-${dione_version}.crate"
          scripts/verify-public-package-privacy.sh "${dione_crate}"
          rendering_version="$(scripts/workspace-package-version.sh dione-rendering)"
          scripts/verify-public-package-privacy.sh "target/package/dione-rendering-${rendering_version}.crate"
          durable_version="$(scripts/workspace-package-version.sh dione-durable)"
          scripts/verify-public-package-privacy.sh "target/package/dione-durable-${durable_version}.crate"
          contracts_version="$(scripts/workspace-package-version.sh dione-contracts)"
          scripts/verify-public-package-privacy.sh "target/package/dione-contracts-${contracts_version}.crate"
          rook_version="$(scripts/workspace-package-version.sh dione-rook)"
          scripts/verify-public-package-privacy.sh "target/package/dione-rook-${rook_version}.crate"
          attention_version="$(scripts/workspace-package-version.sh dione-attention)"
          scripts/verify-public-package-privacy.sh "target/package/dione-attention-${attention_version}.crate"
          evidence_version="$(scripts/workspace-package-version.sh dione-evidence)"
          scripts/verify-public-package-privacy.sh "target/package/dione-evidence-${evidence_version}.crate"
          contradictionary_version="$(scripts/workspace-package-version.sh dione-contradictionary)"
          scripts/verify-public-package-privacy.sh "target/package/dione-contradictionary-${contradictionary_version}.crate"
          bell_rings_version="$(scripts/workspace-package-version.sh dione-bell-rings)"
          scripts/verify-public-package-privacy.sh "target/package/dione-bell-rings-${bell_rings_version}.crate"
          delivery_scheduler_version="$(scripts/workspace-package-version.sh dione-delivery-scheduler)"
          scripts/verify-public-package-privacy.sh "target/package/dione-delivery-scheduler-${delivery_scheduler_version}.crate"
          access_requests_version="$(scripts/workspace-package-version.sh dione-access-requests)"
          scripts/verify-public-package-privacy.sh "target/package/dione-access-requests-${access_requests_version}.crate"
          mutes_version="$(scripts/workspace-package-version.sh dione-mutes)"
          scripts/verify-public-package-privacy.sh "target/package/dione-mutes-${mutes_version}.crate"
          coordination_version="$(scripts/workspace-package-version.sh dione-coordination)"
          teams_identities_version="$(scripts/workspace-package-version.sh dione-teams-identities)"
          discord_identities_version="$(scripts/workspace-package-version.sh dione-discord-identities)"
          pluralkit_identities_version="$(scripts/workspace-package-version.sh dione-pluralkit-identities)"
          mcp_tools_version="$(scripts/workspace-package-version.sh dione-mcp-tools)"
          provider_delivery_version="$(scripts/workspace-package-version.sh dione-provider-delivery)"
          teams_version="$(scripts/workspace-package-version.sh dione-teams)"
          omp_version="$(scripts/workspace-package-version.sh dione-omp)"
          codex_version="$(scripts/workspace-package-version.sh dione-codex)"
          claude_version="$(scripts/workspace-package-version.sh dione-claude)"
          discord_presence_version="$(scripts/workspace-package-version.sh dione-discord-presence)"
          discord_state_version="$(scripts/workspace-package-version.sh dione-discord-state)"
          discord_events_version="$(scripts/workspace-package-version.sh dione-discord-events)"
          tracing_channel_version="$(scripts/workspace-package-version.sh dione-tracing-channel)"
          config_watcher_version="$(scripts/workspace-package-version.sh dione-config-watcher)"
          drop_ledger_version="$(scripts/workspace-package-version.sh dione-drop-ledger)"
          permissions_version="$(scripts/workspace-package-version.sh dione-permissions)"
          discord_bells_version="$(scripts/workspace-package-version.sh dione-discord-bells)"
          discord_gate_version="$(scripts/workspace-package-version.sh dione-discord-gate)"
          oneshot_version="$(scripts/workspace-package-version.sh dione-oneshot)"
          harness_runtime_version="$(scripts/workspace-package-version.sh dione-harness-runtime)"
          discord_scheduling_version="$(scripts/workspace-package-version.sh dione-discord-scheduling)"
          scripts/verify-public-package-privacy.sh "target/package/dione-coordination-${coordination_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-teams-identities-${teams_identities_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-discord-identities-${discord_identities_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-pluralkit-identities-${pluralkit_identities_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-mcp-tools-${mcp_tools_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-provider-delivery-${provider_delivery_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-teams-${teams_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-omp-${omp_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-codex-${codex_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-claude-${claude_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-discord-presence-${discord_presence_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-discord-state-${discord_state_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-discord-events-${discord_events_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-tracing-channel-${tracing_channel_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-config-watcher-${config_watcher_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-drop-ledger-${drop_ledger_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-permissions-${permissions_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-discord-bells-${discord_bells_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-discord-gate-${discord_gate_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-oneshot-${oneshot_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-harness-runtime-${harness_runtime_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-discord-scheduling-${discord_scheduling_version}.crate"
          pre_send_version="$(scripts/workspace-package-version.sh dione-pre-send)"
          outbound_consent_version="$(scripts/workspace-package-version.sh dione-outbound-consent)"
          config_version="$(scripts/workspace-package-version.sh dione-config)"
          scripts/verify-public-package-privacy.sh "target/package/dione-pre-send-${pre_send_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-outbound-consent-${outbound_consent_version}.crate"
          scripts/verify-public-package-privacy.sh "target/package/dione-config-${config_version}.crate"
          presentation_version="$(scripts/workspace-package-version.sh dione-presentation)"
          scripts/verify-public-package-privacy.sh "target/package/dione-presentation-${presentation_version}.crate"
          harness_version="$(scripts/workspace-package-version.sh dione-harness)"
          scripts/verify-public-package-privacy.sh "target/package/dione-harness-${harness_version}.crate"
          identity_display_version="$(scripts/workspace-package-version.sh dione-identity-display)"
          scripts/verify-public-package-privacy.sh "target/package/dione-identity-display-${identity_display_version}.crate"
          gaie_version="$(scripts/workspace-package-version.sh dione-gaie)"
          scripts/verify-public-package-privacy.sh "target/package/dione-gaie-${gaie_version}.crate"
          vaelii_version="$(scripts/workspace-package-version.sh dione-vaelii)"
          scripts/verify-public-package-privacy.sh "target/package/dione-vaelii-${vaelii_version}.crate"
          messages_version="$(scripts/workspace-package-version.sh dione-messages)"
          scripts/verify-public-package-privacy.sh "target/package/dione-messages-${messages_version}.crate"
          rate_limiter_version="$(scripts/workspace-package-version.sh dione-rate-limiter)"
          scripts/verify-public-package-privacy.sh "target/package/dione-rate-limiter-${rate_limiter_version}.crate"

  msrv:
    name: Rust 1.98 minimum supported version
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
      - run: cargo +1.98.0 check --workspace --all-targets --locked

  build:
    name: Release binaries
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
      # PRs build the thin-LTO review profile; main keeps the shipped
      # release profile.
      - name: Build review binaries
        if: ${{ forgejo.event_name == 'pull_request' }}
        run: cargo build --profile review --workspace --bins --locked
      - name: Check review binary
        if: ${{ forgejo.event_name == 'pull_request' }}
        run: ./target/review/dione --version
      - name: Build release binaries
        if: ${{ forgejo.event_name != 'pull_request' }}
        run: cargo build --release --workspace --bins --locked
      - name: Check release binary
        if: ${{ forgejo.event_name != 'pull_request' }}
        run: ./target/release/dione --version

  audit:
    name: Dependency audit
    runs-on: docker
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  required:
    name: Required checks
    needs: [hygiene, format, lint, test, package, msrv, build, audit]
    if: ${{ always() }}
    runs-on: docker
    timeout-minutes: 5
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require every check to succeed
        run: |
          sh .forgejo/scripts/require-successful-checks.sh \
            "hygiene=${{ needs.hygiene.result }}" \
            "format=${{ needs.format.result }}" \
            "lint=${{ needs.lint.result }}" \
            "test=${{ needs.test.result }}" \
            "package=${{ needs.package.result }}" \
            "msrv=${{ needs.msrv.result }}" \
            "build=${{ needs.build.result }}" \
            "audit=${{ needs.audit.result }}"

  release-tag:
    name: Annotated release tag
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    # The release account's integration is restricted to this workflow,
    # main, and push events. Other jobs cannot request its JWT.
    enable-openid-connect: true
    needs: [required]
    runs-on: docker
    timeout-minutes: 15
    steps:
      - uses: https://github.com/dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: "1.98.0"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ forgejo.sha }}
          persist-credentials: false
      - name: Tag a qualified version and changelog bump
        env:
          # Use the installed base toolchain for cargo pkgid without downloading
          # the rustfmt and clippy components from rust-toolchain.toml again.
          RUSTUP_TOOLCHAIN: "1.98.0"
          EXPECTED_COMMIT: ${{ forgejo.sha }}
          PUSH_BEFORE: ${{ forgejo.event.before }}
          RELEASE_AUTH_MODE: oidc
          RELEASE_AUDIENCE: ${{ vars.DIONE_RELEASE_AUDIENCE }}
          RELEASE_REMOTE_URL: ${{ forgejo.server_url }}/${{ forgejo.repository }}.git
        run: sh scripts/tag-qualified-release.sh
