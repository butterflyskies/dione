# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

# --- Advisories -----------------------------------------------------------
[advisories]
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: unmaintained with no patched release; retained through nameplate serde_yaml_ng and Typst serde_yaml; replacement tracked in docs/dependency-maintenance.md; refactor paths also recorded in .audit/oh-my-pi-verification.md" },
    { id = "RUSTSEC-2025-0141", reason = "bincode: transitive via typst → syntect, unmaintained, no alternative" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash: transitive via typst → two-face → syntect, unmaintained, no alternative" },
    { id = "RUSTSEC-2024-0436", reason = "paste: transitive via typst, unmaintained, no control" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust: transitive via typst → syntect, no alternative" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, transitive via typst → fontdb/rustybuzz/pixglyph, no control" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml: transitive via typst → citationberg/syntect, pinned by typst, no control" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml: transitive via typst → citationberg/syntect, pinned by typst, no control" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained, transitive via typst/usvg, no safe upgrade currently available" },
    { id = "RUSTSEC-2026-0235", reason = "rkyv 0.7: transitive via mitex's embedded specification; Dione accepts LaTeX text, not untrusted rkyv archives, and mitex has no newer release" },
]

# --- Licenses -------------------------------------------------------------
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "0BSD",
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

# --- Bans ------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# --- Sources ---------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
