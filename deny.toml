# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

# --- Advisories -----------------------------------------------------------
[advisories]
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: unmaintained with no patched release; retained through nameplate serde_yaml_ng; replacement tracked in docs/dependency-maintenance.md; refactor paths also recorded in .audit/oh-my-pi-verification.md" },
    { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained with no patched release; used across timestamp, delivery and config code; migration tracked in docs/dependency-maintenance.md (#765)" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz: unmaintained with no patched release; parses configured IANA zones; migration tracked in docs/dependency-maintenance.md (#765)" },
]

# --- Licenses -------------------------------------------------------------
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

# --- Bans ------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# --- Sources ---------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
